name: Cron jobs (replaces Vercel crons)
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: attach-next-reel (every 10 min)
        if: github.event.schedule != '0 5 * * *'
        run: >-
          curl -fsS -m 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "https://openreply-eventimio.netlify.app/api/cron/attach-next-reel"
      - name: refresh-tokens + snapshot-followers (daily)
        if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS -m 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://openreply-eventimio.netlify.app/api/cron/refresh-tokens"
          curl -fsS -m 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://openreply-eventimio.netlify.app/api/cron/snapshot-followers"
